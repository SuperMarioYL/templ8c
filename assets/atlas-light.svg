<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif"
     role="img" aria-label="templ8c architecture: CLI to Checker to TemplateLoader, Renderer, Comparator, fed by ConformanceSpec">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>
  <text x="20" y="38" font-size="13" font-weight="600" fill="#6E6E73">templ8c — load &#9656; render &#9656; compare</text>

  <!-- static connectors -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="160" y1="205" x2="185" y2="205" marker-end="url(#ah-l)"/>
    <line x1="325" y1="205" x2="350" y2="205" marker-end="url(#ah-l)"/>
    <line x1="500" y1="205" x2="525" y2="205" marker-end="url(#ah-l)"/>
    <line x1="655" y1="205" x2="680" y2="205" marker-end="url(#ah-l)"/>
    <line x1="770" y1="125" x2="770" y2="170" marker-end="url(#ah-l)"/>
  </g>

  <!-- marching dashes (data flow) -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="160" y1="205" x2="181" y2="205" stroke="#0071E3" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="325" y1="205" x2="346" y2="205" stroke="#5E5CE6" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="500" y1="205" x2="521" y2="205" stroke="#10A37F" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="655" y1="205" x2="676" y2="205" stroke="#5E5CE6" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="770" y1="125" x2="770" y2="166" stroke="#5E5CE6" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- data packets -->
  <g>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M160,205 L181,205" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M325,205 L346,205" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#10A37F">
      <animateMotion path="M500,205 L521,205" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M655,205 L676,205" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nodes -->
  <g>
    <rect x="20" y="170" width="140" height="70" rx="14" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="90" y="210" text-anchor="middle" font-size="14" font-weight="600" fill="#0A4F9E">CLI</text>

    <rect x="185" y="170" width="140" height="70" rx="14" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-0.8s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="255" y="210" text-anchor="middle" font-size="14" font-weight="600" fill="#0A4F9E">Checker</text>

    <rect x="350" y="170" width="150" height="70" rx="14" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.6s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="425" y="204" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">TemplateLoader</text>
    <text x="425" y="222" text-anchor="middle" font-size="10" fill="#6E6E73">tokenizer_config.json</text>

    <rect x="525" y="170" width="130" height="70" rx="14" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.4s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="590" y="210" text-anchor="middle" font-size="14" font-weight="600" fill="#0B6B53">Renderer</text>

    <rect x="680" y="170" width="180" height="70" rx="14" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-3.2s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="770" y="204" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">Comparator</text>
    <text x="770" y="222" text-anchor="middle" font-size="10" fill="#6E6E73">PASS / FAIL + diff</text>

    <rect x="680" y="70" width="180" height="55" rx="14" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5"/>
    <text x="770" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#4B3FC4">ConformanceSpec</text>
    <text x="770" y="111" text-anchor="middle" font-size="10" fill="#6E6E73">expected tool-call format</text>
  </g>

  <text x="20" y="335" font-size="11" fill="#6E6E73">single process, single CLI entry &#8212; no microservices. ServerProbe (m3) adds vLLM/SGLang live probing later.</text>
</svg>
