[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "templ8c"
version = "0.2.0"
description = "Render Jinja chat templates and compare role markers and tool-call fields against repository-defined conformance specifications."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "SuperMarioYL" }]
keywords = ["chat-template", "conformance", "tool-calling", "llm", "glm", "qwen", "deepseek"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "jinja2>=3.1",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.scripts]
templ8c = "templ8c.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/SuperMarioYL/templ8c"
Repository = "https://github.com/SuperMarioYL/templ8c"

[tool.hatch.build.targets.wheel]
packages = ["src/templ8c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# typer's Option/Argument return immutable metadata objects; calling them in
# argument defaults is the framework's intended signature style.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
